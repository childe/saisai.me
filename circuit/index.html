<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>电路实验室 - SaiSai.me</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="home btn" href="../index.html" aria-label="回到首页">🏠</a>
    <h1>⚡ 电路实验室</h1>
    <div class="seg" id="modeSeg">
      <button class="btn" data-mode="free">自由搭建</button>
      <button class="btn" data-mode="task">小任务</button>
    </div>
    <div class="seg" id="styleSeg">
      <button class="btn" data-style="cartoon">🧸 实物</button>
      <button class="btn" data-style="symbol">⊗ 符号</button>
    </div>
    <span class="spacer"></span>
    <button class="btn" id="muteBtn" aria-label="静音">🔊</button>
    <button class="btn" id="undoBtn">↶ 撤销</button>
    <button class="btn" id="clearBtn">🗑 清空</button>
  </header>

  <div id="taskbar" hidden></div>

  <main class="workspace">
    <aside id="palette"><div class="palette-list"></div></aside>
    <div class="stage">
      <svg id="board" viewBox="0 0 1120 720" preserveAspectRatio="xMidYMid meet">
        <defs>
          <pattern id="dots" x="-20" y="-20" width="40" height="40" patternUnits="userSpaceOnUse">
            <circle cx="20" cy="20" r="2.2" fill="#e0cfb2"/>
          </pattern>
        </defs>
        <rect class="board-bg" x="0" y="0" width="1120" height="720" rx="18" fill="url(#dots)"/>
        <g id="wires"></g>
        <g id="parts"></g>
        <g id="overlay"></g>
      </svg>
      <div id="panel" hidden></div>
      <div id="banner" hidden>暂时无法计算</div>
      <div id="confirm" hidden>
        <div class="confirm-box">
          <p>清空画布？</p>
          <div class="confirm-actions">
            <button class="btn danger" data-confirm="yes">清空</button>
            <button class="btn" data-confirm="no">取消</button>
          </div>
        </div>
      </div>
    </div>
  </main>
  <div id="ghost" hidden></div>
</body>
</html>

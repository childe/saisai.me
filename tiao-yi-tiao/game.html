<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>跳一跳</title>
    <style>
        body {
            margin: 0; overflow: hidden; background-color: #f0f0f0; font-family: 'Arial', sans-serif;
            /* iPad 上长按蓄力时不要弹放大镜 / 选字菜单，也不要双击缩放 */
            -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas { display: block; touch-action: none; }
        #score-container {
            position: absolute; top: 20px; left: 20px; color: #333; font-size: 24px; font-weight: bold; pointer-events: none; user-select: none;
        }
        #info {
            font-size: 14px; color: #666; margin-top: 5px;
        }
        #best { font-size: 16px; color: #888; font-weight: normal; }
        /* 结束层铺满全屏：点哪里都能重开 */
        #game-over {
            position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.15); z-index: 10; touch-action: manipulation;
        }
        #game-over .panel {
            background: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 12px;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        #new-record { color: #ff9800; font-weight: bold; display: none; margin: 0 0 10px 0; }
        #restart-hint { font-size: 13px; color: #999; margin-top: 12px; }
        /* 力度条：跟在主角头顶，蓄满后变红闪烁 */
        #power {
            position: absolute; width: 60px; height: 8px; border-radius: 4px;
            background: rgba(0, 0, 0, 0.15); transform: translate(-50%, -100%);
            pointer-events: none; display: none; overflow: hidden; z-index: 4;
        }
        #power-fill { height: 100%; width: 0; background: #28a745; border-radius: 4px; }
        #power.full #power-fill { background: #ff3b30; animation: powerBlink 0.3s ease-in-out infinite alternate; }
        @keyframes powerBlink { from { opacity: 1; } to { opacity: 0.4; } }
        button {
            background: #28a745; color: white; border: none; padding: 10px 30px;
            font-size: 18px; border-radius: 5px; cursor: pointer; margin-top: 20px;
        }
        button:hover { background: #218838; }
        .float-text {
            position: absolute; font-weight: bold; font-size: 20px; animation: floatUp 1.0s ease-out forwards; pointer-events: none; z-index: 5; text-shadow: 1px 1px 2px white;
            white-space: nowrap;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -80px); }
        }
    </style>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="score-container">
    得分: <span id="score">0</span> <span id="best"></span>
    <div id="info">按住蓄力，松开跳跃</div>
</div>

<div id="power"><div id="power-fill"></div></div>

<div id="game-over">
    <div class="panel">
        <h2 style="margin:0 0 10px 0;">游戏结束</h2>
        <p id="new-record">新纪录！</p>
        <p>本次得分: <span id="final-score" style="font-size: 24px; color: #d9534f; font-weight:bold;">0</span></p>
        <p>最高分: <span id="best-score">0</span></p>
        <button>重新开始</button>
        <div id="restart-hint">点任意位置或按空格重开</div>
    </div>
</div>

<script>
    // --- 游戏配置 ---
    const CONFIG = {
        cubeSize: 4,
        heroSize: 1.6, 
        maxDistance: 12,  
        compressionSpeed: 0.01, // 每 1/60 秒压缩量
        minCompression: 0.5,    // 蓄力上限：压到这里就满了
        jumpDuration: 583,      // 滞空毫秒数，等于原来 60fps 下的 35 帧
        jumpPeak: 6.1,          // 跳跃最高点离方块面的高度
        
        types: [
            { id: 'normal', color: 0xffffff, score: 0, shape: 'box', prob: 0.4 }, 
            { id: 'store', color: 0x4fc3f7, score: 15, shape: 'box', prob: 0.2, name: "便利店" }, 
            { id: 'rubik', color: 0xff5252, score: 10, shape: 'box', prob: 0.2, name: "魔方" }, 
            // ✨ 修正：音乐盒现在的模型是方形底座，所以形状改为 box，确保碰撞检测准确
            { id: 'music', color: 0xff9800, score: 30, shape: 'box', prob: 0.2, name: "音乐盒" } 
        ]
    };

    // --- 全局变量 ---
    let scene, camera, renderer;
    let hero;
    let blocks = [];
    let particles = []; 
    let score = 0;
    let state = 'ready'; 
    let compression = 1; 
    let jump = null; // 起跳时记下起点、方向和距离，飞行按时间插值
    let currentBlockIndex = 0;
    let heroSkinUnlocked = false;
    let comboCount = 0;
    let bestScore = 0;
    let gameOverAt = 0;
    let lastFrameTime = 0;
    const VIEW = 20;
    const BEST_KEY = 'tiao-yi-tiao.best';

    let dirLight, groundShadow;

    // 动画相关
    let activeRubikAnimations = []; 

    // 音频上下文
    let audioCtx;
    let chargeOscillator = null;
    let chargeGainNode = null;

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeeeeee);

        const aspect = window.innerWidth / window.innerHeight;
        camera = new THREE.OrthographicCamera(-VIEW * aspect, VIEW * aspect, VIEW, -VIEW, 1, 1000);
        camera.position.set(20, 20, 20);
        camera.lookAt(0, 0, 0);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        // 平行光跟着主角走（见 animate），阴影范围要盖住整个可视区
        dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(2048, 2048);
        const sc = dirLight.shadow.camera;
        sc.left = -30; sc.right = 30; sc.top = 30; sc.bottom = -30; sc.near = 1; sc.far = 100;
        dirLight.shadow.bias = -0.001;
        scene.add(dirLight);
        scene.add(dirLight.target);

        // 只接收阴影的透明地面，让方块和主角在地上有影子
        groundShadow = new THREE.Mesh(
            new THREE.PlaneGeometry(200, 200),
            new THREE.ShadowMaterial({ opacity: 0.12 })
        );
        groundShadow.rotation.x = -Math.PI / 2;
        groundShadow.position.y = -CONFIG.cubeSize / 2;
        groundShadow.receiveShadow = true;
        scene.add(groundShadow);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 用 pointer 事件统一鼠标和触摸，避免触摸后再补发一次鼠标事件
        renderer.domElement.addEventListener('pointerdown', onPress);
        window.addEventListener('pointerup', onRelease);
        window.addEventListener('pointercancel', onRelease);
        renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());
        window.addEventListener('keydown', onKeyDown);
        window.addEventListener('keyup', onKeyUp);
        window.addEventListener('resize', onResize);
        document.getElementById('game-over').addEventListener('click', tryRestart);

        // iOS 不把 pointerdown（touchstart）算作能解锁音频的手势，要 touchend / click
        for (const ev of ['pointerdown', 'touchend', 'click']) {
            window.addEventListener(ev, unlockAudio, { capture: true });
        }

        bestScore = loadBest();
        startGame();
        requestAnimationFrame(animate);
    }

    // --- 音频系统 ---
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        // iOS 切后台回来是 'interrupted'，也要 resume
        if (audioCtx.state !== 'running') {
            audioCtx.resume();
        }
    }

    // 在用户手势里调用：iOS 要播一帧静音 buffer 才真正放开输出，
    // audioSession 设成 playback，静音模式下才有声音
    function unlockAudio() {
        try {
            if (navigator.audioSession) navigator.audioSession.type = 'playback';
        } catch (e) { /* iOS 16.4 以下不支持 */ }
        try {
            initAudio();
            const src = audioCtx.createBufferSource();
            src.buffer = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);
            src.connect(audioCtx.destination);
            src.start();
        } catch (e) { console.warn('[tiao-yi-tiao audio]', e); }
    }

    function startChargeSound() {
        initAudio();
        if (chargeOscillator) return;

        chargeOscillator = audioCtx.createOscillator();
        chargeGainNode = audioCtx.createGain();
        
        chargeOscillator.type = 'sine';
        chargeOscillator.frequency.setValueAtTime(400, audioCtx.currentTime); 
        
        chargeOscillator.connect(chargeGainNode);
        chargeGainNode.connect(audioCtx.destination);
        
        chargeGainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        chargeOscillator.start();
    }

    function updateChargeSound(compressionLevel) {
        if (chargeOscillator && audioCtx) {
            const freq = 400 + (1 - compressionLevel) * 400; 
            chargeOscillator.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.1);
            
            const time = audioCtx.currentTime;
            const volume = (Math.sin(time * 20) > 0) ? 0.1 : 0;
            chargeGainNode.gain.setTargetAtTime(volume, time, 0.01);
        }
    }

    function stopChargeSound() {
        if (chargeOscillator) {
            chargeGainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
            chargeOscillator.stop(audioCtx.currentTime + 0.1);
            chargeOscillator = null;
            chargeGainNode = null;
        }
    }

    function playMusicBoxMelody() {
        initAudio();
        const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 659.25]; 
        const duration = 0.15;
        let startTime = audioCtx.currentTime;

        notes.forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle'; 
            osc.frequency.value = freq;
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(startTime + i * duration);
            
            gain.gain.setValueAtTime(0, startTime + i * duration);
            gain.gain.linearRampToValueAtTime(0.2, startTime + i * duration + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + i * duration + 0.4);
            
            osc.stop(startTime + i * duration + 0.5);
        });
    }

    function playCenterHitSound(combo) {
        initAudio();
        
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc1.type = 'triangle';
        osc2.type = 'sine';

        const pitchStep = Math.min(combo, 15);
        const baseFreq = 523.25; 
        const freq = baseFreq * Math.pow(1.05946, pitchStep); 

        osc1.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc2.frequency.setValueAtTime(freq * 1.5, audioCtx.currentTime); 

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        osc1.start(now);
        osc2.start(now);

        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.4, now + 0.02); 
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5); 

        osc1.stop(now + 0.6);
        osc2.stop(now + 0.6);
    }

    // --- 游戏逻辑 ---

    function startGame() {
        blocks.forEach(b => scene.remove(b.mesh));
        particles.forEach(p => scene.remove(p.mesh));
        particles = [];
        activeRubikAnimations = [];

        if (hero) scene.remove(hero);
        blocks = [];
        
        score = 0;
        comboCount = 0; 
        heroSkinUnlocked = false;
        updateScoreUI();
        document.getElementById('game-over').style.display = 'none';
        hidePowerBar();
        jump = null;

        createBlock(0, 0, 'normal');
        createBlock(-8, 0); 

        createHero();
        
        camera.position.set(20, 20, 20);
        camera.lookAt(0, 0, 0);
        
        state = 'ready';
        currentBlockIndex = 0;
    }

    function createHero() {
        hero = new THREE.Group();
        const material = new THREE.MeshLambertMaterial({ color: 0x333333 }); 
        const bodyGeo = new THREE.CylinderGeometry(0.28, 0.35, 1.1, 32); 
        const bodyMesh = new THREE.Mesh(bodyGeo, material);
        bodyMesh.position.y = -0.1; 
        bodyMesh.castShadow = true;
        hero.add(bodyMesh);
        const headGeo = new THREE.SphereGeometry(0.32, 32, 32);
        const headMesh = new THREE.Mesh(headGeo, material);
        headMesh.position.y = 0.75; 
        headMesh.castShadow = true;
        hero.add(headMesh);
        hero.position.set(0, CONFIG.cubeSize/2 + CONFIG.heroSize/2, 0);
        scene.add(hero);
    }
    
    function checkSkinUnlock() {
        if (score >= 100 && !heroSkinUnlocked) {
            heroSkinUnlocked = true;
            const goldMat = new THREE.MeshPhongMaterial({ color: 0xFFD700, emissive: 0x332200, specular: 0xffffff, shininess: 100 });
            hero.children.forEach(child => child.material = goldMat);
            showFloatText("新皮肤解锁！", window.innerWidth/2, window.innerHeight/2 - 100, '#FFD700');
        }
    }

    function spawnParticle() {
        const range = 0.4;
        const x = hero.position.x + (Math.random() - 0.5) * range;
        const y = hero.position.y + (Math.random() - 0.5) * range;
        const z = hero.position.z + (Math.random() - 0.5) * range;
        const geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        const material = new THREE.MeshBasicMaterial({ color: 0xFFD700, transparent: true, opacity: 0.8 });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(x, y, z);
        mesh.rotation.x = Math.random() * Math.PI;
        mesh.rotation.y = Math.random() * Math.PI;
        scene.add(mesh);
        particles.push({ mesh: mesh, life: 1.0 });
    }

    function updateParticles(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.life -= 0.03 * dt; 
            p.mesh.rotation.x += 0.1 * dt;
            p.mesh.rotation.y += 0.1 * dt;
            p.mesh.scale.setScalar(p.life);
            p.mesh.material.opacity = p.life;
            if (p.life <= 0) {
                scene.remove(p.mesh);
                particles.splice(i, 1);
            }
        }
    }

    // --- 特殊方块生成与效果 ---

    function createRubikMesh(size) {
        const group = new THREE.Group();
        const segments = 3;
        const gap = 0.08;
        const subSize = (size / segments) - gap;
        const offset = size / segments;
        const colors = [0xffffff, 0xffd500, 0x009e60, 0x0051ba, 0xc41e3a, 0xff5800];

        const innerCore = new THREE.Mesh(new THREE.BoxGeometry(size - 0.1, size - 0.1, size - 0.1), new THREE.MeshBasicMaterial({ color: 0x000000 }));
        group.add(innerCore);
        
        const geometry = new THREE.BoxGeometry(subSize, subSize, subSize);
        
        for(let x = 0; x < segments; x++) {
            for(let y = 0; y < segments; y++) {
                for(let z = 0; z < segments; z++) {
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const material = new THREE.MeshLambertMaterial({ color: color });
                    const voxel = new THREE.Mesh(geometry, material);
                    voxel.position.set((x - 1) * offset, (y - 1) * offset, (z - 1) * offset);
                    
                    if (y === 2) {
                        voxel.userData.isTopLayer = true;
                    }
                    
                    voxel.castShadow = true;
                    voxel.receiveShadow = true;
                    group.add(voxel);
                }
            }
        }
        return group;
    }

    function triggerRubikAnimation(rubikGroup) {
        const pivot = new THREE.Group();
        pivot.position.y = CONFIG.cubeSize / 3; 
        rubikGroup.add(pivot);

        const topVoxels = [];
        rubikGroup.children.forEach(child => {
            if (child.userData.isTopLayer) {
                topVoxels.push(child);
            }
        });

        topVoxels.forEach(voxel => {
            pivot.attach(voxel);
        });

        activeRubikAnimations.push({
            pivot: pivot,
            targetRotation: Math.PI / 2, 
            currentRotation: 0,
            speed: 0.1
        });
    }

    function createStoreMesh(size) {
        const group = new THREE.Group();
        const mainGeo = new THREE.BoxGeometry(size, size, size);
        const mainMat = new THREE.MeshLambertMaterial({ color: 0xffffff }); 
        const mainMesh = new THREE.Mesh(mainGeo, mainMat);
        mainMesh.receiveShadow = true;
        mainMesh.castShadow = true;
        group.add(mainMesh);

        const stripeHeight = size * 0.05;
        const stripeDepth = size + 0.05; 
        const stripeGeo = new THREE.BoxGeometry(stripeDepth, stripeHeight, stripeDepth);
        const stripe1 = new THREE.Mesh(stripeGeo, new THREE.MeshLambertMaterial({ color: 0xFF6F00 })); 
        stripe1.position.y = size/2 - stripeHeight * 0.8;
        group.add(stripe1);
        const stripe2 = new THREE.Mesh(stripeGeo, new THREE.MeshLambertMaterial({ color: 0x007E33 })); 
        stripe2.position.y = size/2 - stripeHeight * 2.0;
        group.add(stripe2);
        const stripe3 = new THREE.Mesh(stripeGeo, new THREE.MeshLambertMaterial({ color: 0xCC0000 })); 
        stripe3.position.y = size/2 - stripeHeight * 3.2;
        group.add(stripe3);

        const doorHeight = size * 0.5;
        const doorWidth = size * 0.6;
        const doorMat = new THREE.MeshLambertMaterial({ 
            color: 0x87CEEB, 
            transparent: true, 
            opacity: 0.9,
            emissive: 0x000000 
        });
        doorMat.userData.isGlass = true;

        const doorZ = new THREE.Mesh(new THREE.BoxGeometry(doorWidth, doorHeight, 0.1), doorMat);
        doorZ.position.set(0, -size/4, size/2 + 0.05);
        group.add(doorZ);

        const doorX = new THREE.Mesh(new THREE.BoxGeometry(0.1, doorHeight, doorWidth), doorMat);
        doorX.position.set(size/2 + 0.05, -size/4, 0);
        group.add(doorX);
        
        const signGeo = new THREE.BoxGeometry(size * 0.8, size * 0.1, size * 0.8);
        const signMesh = new THREE.Mesh(signGeo, new THREE.MeshLambertMaterial({ color: 0xeeeeee }));
        signMesh.position.y = size/2 + size * 0.05;
        group.add(signMesh);

        return group;
    }

    function lightUpStore(storeGroup) {
        storeGroup.traverse((child) => {
            if (child.material && child.material.userData && child.material.userData.isGlass) {
                child.material.color.setHex(0xFFFFE0);
                child.material.emissive.setHex(0xFFD700); 
                child.material.emissiveIntensity = 0.8;
                child.material.opacity = 1.0;
            }
        });
    }

    function createMusicBoxMesh(size) {
        const group = new THREE.Group();
        const baseGeo = new THREE.BoxGeometry(size, size, size);
        const baseMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 }); 
        const base = new THREE.Mesh(baseGeo, baseMat);
        base.castShadow = true;
        base.receiveShadow = true;
        group.add(base);
        const topY = size / 2;
        const diskRadius = size * 0.4;
        const diskHeight = 0.1;
        const diskGeo = new THREE.CylinderGeometry(diskRadius, diskRadius, diskHeight, 32);
        const diskMat = new THREE.MeshLambertMaterial({ color: 0x111111 }); 
        const disk = new THREE.Mesh(diskGeo, diskMat);
        disk.position.y = topY + diskHeight / 2;
        disk.receiveShadow = true;
        group.add(disk);
        const labelGeo = new THREE.CylinderGeometry(size * 0.15, size * 0.15, diskHeight + 0.02, 32);
        const labelMat = new THREE.MeshLambertMaterial({ color: 0xFFD700 }); 
        const label = new THREE.Mesh(labelGeo, labelMat);
        label.position.y = topY + diskHeight / 2;
        group.add(label);
        const poleHeight = size * 0.5;
        const poleGeo = new THREE.CylinderGeometry(0.05, 0.05, poleHeight, 8);
        const poleMat = new THREE.MeshStandardMaterial({ color: 0xC0C0C0, metalness: 0.8 }); 
        const pole = new THREE.Mesh(poleGeo, poleMat);
        pole.position.set(size * 0.35, topY + poleHeight / 2, -size * 0.35); 
        group.add(pole);
        const hornGeo = new THREE.ConeGeometry(size * 0.25, size * 0.6, 32, 1, true);
        const hornMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, roughness: 0.3, metalness: 0.8, side: THREE.DoubleSide });
        const horn = new THREE.Mesh(hornGeo, hornMat);
        horn.position.set(size * 0.2, topY + poleHeight + size * 0.2, -size * 0.2);
        const target = new THREE.Vector3(0, topY + size*0.5, size*0.5);
        horn.lookAt(target); 
        horn.rotation.x += Math.PI / 2; 
        group.add(horn);
        return group;
    }

    function createBlock(x, z, fixedType = null) {
        let typeData = CONFIG.types[0];
        if (!fixedType) {
            const rand = Math.random();
            let cumProb = 0;
            for (let t of CONFIG.types) {
                cumProb += t.prob;
                if (rand < cumProb) {
                    typeData = t;
                    break;
                }
            }
        } else {
            typeData = CONFIG.types.find(t => t.id === fixedType);
        }

        let mesh;
        if (typeData.id === 'rubik') {
            mesh = createRubikMesh(CONFIG.cubeSize);
        } else if (typeData.id === 'store') {
            mesh = createStoreMesh(CONFIG.cubeSize);
        } else if (typeData.id === 'music') {
            mesh = createMusicBoxMesh(CONFIG.cubeSize);
        } else {
            let geometry;
            if (typeData.shape === 'cylinder') {
                geometry = new THREE.CylinderGeometry(2, 2, CONFIG.cubeSize, 32);
            } else {
                geometry = new THREE.BoxGeometry(4, CONFIG.cubeSize, 4);
            }
            const material = new THREE.MeshLambertMaterial({ color: typeData.color });
            mesh = new THREE.Mesh(geometry, material);
            mesh.receiveShadow = true;
            mesh.castShadow = true;
        }

        mesh.position.set(x, 0, z);
        scene.add(mesh);

        blocks.push({
            mesh: mesh,
            type: typeData,
            x: x,
            z: z
        });
    }

    function spawnNextBlock() {
        const prevBlock = blocks[blocks.length - 1];
        const distance = 4 + Math.random() * 6; 
        const direction = Math.random() > 0.5 ? 'x' : 'z';
        let nextX = prevBlock.x;
        let nextZ = prevBlock.z;
        if (direction === 'x') {
            nextX -= distance;
        } else {
            nextZ -= distance;
        }
        createBlock(nextX, nextZ);
        if (blocks.length > 10) {
            scene.remove(blocks[0].mesh);
            blocks.shift();
            currentBlockIndex--;
        }
    }

    function onPress(e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        e.preventDefault();
        startCharge();
    }

    function onRelease() {
        releaseJump();
    }

    function onKeyDown(e) {
        if (e.code !== 'Space' && e.code !== 'Enter') return;
        e.preventDefault();
        if (e.repeat) return;
        if (state === 'over') {
            tryRestart();
        } else if (e.code === 'Space') {
            unlockAudio();
            startCharge();
        }
    }

    function onKeyUp(e) {
        if (e.code === 'Space') releaseJump();
    }

    function startCharge() {
        if (state === 'ready') {
            state = 'charging';
            compression = 1;
            startChargeSound();
        }
    }

    function releaseJump() {
        if (state !== 'charging') return;
        state = 'jumping';
        stopChargeSound();
        hidePowerBar();

        const power = 1 - compression; 
        const curr = blocks[currentBlockIndex];
        const next = blocks[currentBlockIndex + 1];
        const dx = next.x - curr.x;
        const dz = next.z - curr.z;
        const len = Math.sqrt(dx*dx + dz*dz);

        hero.scale.y = 1;
        hero.position.y = groundY();

        jump = {
            startX: hero.position.x,
            startZ: hero.position.z,
            dirX: dx / len,
            dirZ: dz / len,
            dist: power * CONFIG.maxDistance * 2.1,
            elapsed: 0
        };
    }

    function groundY() {
        return CONFIG.cubeSize/2 + CONFIG.heroSize/2;
    }

    function onResize() {
        const aspect = window.innerWidth / window.innerHeight;
        camera.left = -VIEW * aspect;
        camera.right = VIEW * aspect;
        camera.top = VIEW;
        camera.bottom = -VIEW;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // --- 力度条 ---
    const powerEl = document.getElementById('power');
    const powerFillEl = document.getElementById('power-fill');

    function updatePowerBar() {
        const level = (1 - compression) / (1 - CONFIG.minCompression);
        powerFillEl.style.width = (level * 100) + '%';
        powerEl.classList.toggle('full', compression <= CONFIG.minCompression);

        const p = hero.position.clone();
        p.y += 1.6;
        p.project(camera);
        powerEl.style.left = ((p.x + 1) / 2 * window.innerWidth) + 'px';
        powerEl.style.top = ((1 - p.y) / 2 * window.innerHeight - 8) + 'px';
        powerEl.style.display = 'block';
    }

    function hidePowerBar() {
        powerEl.style.display = 'none';
        powerEl.classList.remove('full');
    }

    function animate(now) {
        requestAnimationFrame(animate);

        // dt 以 1/60 秒为 1：不管屏幕是 60Hz 还是 120Hz，蓄力和动画速度都一样
        const dt = lastFrameTime ? Math.min((now - lastFrameTime) / (1000 / 60), 3) : 1;
        lastFrameTime = now;

        if (state === 'charging') {
            compression = Math.max(CONFIG.minCompression, compression - CONFIG.compressionSpeed * dt);
            hero.scale.y = compression;
            hero.position.y = (CONFIG.cubeSize/2) + (CONFIG.heroSize/2 * compression);
            updateChargeSound(compression);
            updatePowerBar();
        }

        if (state === 'jumping') {
            jump.elapsed += dt * (1000 / 60);
            const t = Math.min(jump.elapsed / CONFIG.jumpDuration, 1);
            hero.position.x = jump.startX + jump.dirX * jump.dist * t;
            hero.position.z = jump.startZ + jump.dirZ * jump.dist * t;
            hero.position.y = groundY() + CONFIG.jumpPeak * 4 * t * (1 - t);
            // 按进度翻一整圈，落地时正好转回正
            const spin = Math.PI * 2 * t;
            hero.rotation.x = -Math.sign(jump.dirZ) * spin;
            hero.rotation.z = Math.sign(jump.dirX) * spin;

            if (heroSkinUnlocked && Math.random() < dt) {
                spawnParticle();
            }

            if (t >= 1) {
                handleLanding();
            }
        }
        
        for(let i = activeRubikAnimations.length - 1; i >= 0; i--) {
            const anim = activeRubikAnimations[i];
            if (anim.currentRotation < anim.targetRotation) {
                const step = Math.min(anim.speed * dt, anim.targetRotation - anim.currentRotation);
                anim.pivot.rotation.y += step;
                anim.currentRotation += step;
            } else {
                anim.pivot.rotation.y = anim.targetRotation;
                activeRubikAnimations.splice(i, 1);
            }
        }
        
        updateParticles(dt);

        if (state !== 'ended' && state !== 'over') {
            const targetPos = new THREE.Vector3(
                hero.position.x + 20, 
                20, 
                hero.position.z + 20
            );
            camera.position.lerp(targetPos, 1 - Math.pow(1 - 0.03, dt)); 
            camera.lookAt(hero.position.x, 0, hero.position.z);
        }

        dirLight.position.set(hero.position.x + 10, 20, hero.position.z);
        dirLight.target.position.set(hero.position.x, 0, hero.position.z);
        groundShadow.position.x = hero.position.x;
        groundShadow.position.z = hero.position.z;

        renderer.render(scene, camera);
    }

    function handleLanding() {
        jump = null;
        hero.position.y = groundY(); 
        hero.rotation.set(0,0,0); 

        const targetBlock = blocks[currentBlockIndex + 1];
        const currentBlock = blocks[currentBlockIndex];
        
        // 计算纯几何距离（用于分数奖励判断，如“正中心”）
        const distToNextCenter = Math.sqrt(
            Math.pow(hero.position.x - targetBlock.x, 2) + 
            Math.pow(hero.position.z - targetBlock.z, 2)
        );

        // ✨ 严格的碰撞检测：判定是否落在方块面上
        const isSafe = (block, x, z) => {
            const limit = CONFIG.cubeSize / 2; // 2.0
            const dx = x - block.x;
            const dz = z - block.z;
            
            if (block.type.shape === 'box') {
                // 矩形判定：中心点坐标偏移必须在矩形范围内
                return Math.abs(dx) <= limit && Math.abs(dz) <= limit;
            } else {
                // 圆形判定：中心点距离必须在半径内
                return (dx*dx + dz*dz) <= limit*limit;
            }
        };

        const onNext = isSafe(targetBlock, hero.position.x, hero.position.z);
        const onCurr = isSafe(currentBlock, hero.position.x, hero.position.z);

        if (onNext) {
            state = 'waiting'; 
            // 只要在方块面上就算成功，分数根据是否接近中心判定
            successLand(targetBlock, distToNextCenter);
            currentBlockIndex++;
            setTimeout(() => {
                spawnNextBlock();
                state = 'ready';
            }, 200);
        } 
        else if (onCurr) {
            state = 'ready'; // 还在当前方块上，允许再次跳跃
        }
        else {
            state = 'ended';
            const fallAnim = setInterval(() => {
                hero.position.y -= 0.4; 
                if(hero.position.y < -5) {
                    clearInterval(fallAnim);
                    showGameOver();
                }
            }, 16);
        }
    }

    function successLand(block, distance) {
        let points = 1;
        let text = "+1";
        let color = "#333";

        if (distance < 0.8) {
            points = 2; 
            text = "完美 +2";
            color = "#ff0000";
            comboCount++; 
            playCenterHitSound(comboCount); 
        } else {
            comboCount = 0; 
        }

        // 特殊方块的奖励分在 500ms 后单独加，这里不要再算进 points
        if (block.type.score > 0) {
            setTimeout(() => {
                let colorHex;
                if (typeof block.type.color === 'number') {
                     colorHex = '#' + new THREE.Color(block.type.color).getHexString();
                } else {
                     colorHex = "#333"; 
                }
                
                showFloatText(`${block.type.name} +${block.type.score}`, window.innerWidth/2, window.innerHeight/2 - 80, colorHex);
                score += block.type.score;
                updateScoreUI();
                checkSkinUnlock();

                if (block.type.id === 'music') {
                    playMusicBoxMelody();
                } else if (block.type.id === 'rubik') {
                    triggerRubikAnimation(block.mesh);
                } else if (block.type.id === 'store') {
                    lightUpStore(block.mesh);
                }

            }, 500);
        }

        score += points;
        updateScoreUI();
        checkSkinUnlock();
        
        showFloatText(text, window.innerWidth/2, window.innerHeight/2 - 50, color);
    }

    function showFloatText(str, x, y, color) {
        const div = document.createElement('div');
        div.className = 'float-text';
        div.innerText = str;
        div.style.left = x + 'px';
        div.style.top = y + 'px';
        div.style.color = typeof color === 'string' ? color : '#' + color;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 1500);
    }

    function updateScoreUI() {
        document.getElementById('score').innerText = score;
        document.getElementById('best').innerText = bestScore > 0 ? `最高 ${bestScore}` : '';
    }

    function loadBest() {
        try {
            return parseInt(localStorage.getItem(BEST_KEY), 10) || 0;
        } catch (e) {
            return 0;
        }
    }

    function showGameOver() {
        state = 'over';
        gameOverAt = performance.now();
        const isRecord = score > bestScore;
        if (isRecord) {
            bestScore = score;
            try { localStorage.setItem(BEST_KEY, String(bestScore)); } catch (e) { /* 无痕模式 */ }
        }
        document.getElementById('final-score').innerText = score;
        document.getElementById('best-score').innerText = bestScore;
        document.getElementById('new-record').style.display = isRecord ? 'block' : 'none';
        document.getElementById('game-over').style.display = 'flex';
    }

    function tryRestart() {
        // 结束层刚出来时还按着的手指不要误触重开
        if (state !== 'over' || performance.now() - gameOverAt < 400) return;
        startGame();
    }

    init();

</script>

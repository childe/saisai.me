<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解方程学习</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="app.js"></script>
</head>
<body>
    <header class="topbar">
        <a class="home" href="../index.html" aria-label="回到首页">🏠</a>
        <h1>解方程学习</h1>
    </header>

    <main class="page">
        <section class="settings">
            <div class="modes" role="group" aria-label="模式">
                <button class="mode" data-mode="practice" aria-pressed="true">✏️ 自己做</button>
                <button class="mode" data-mode="explain" aria-pressed="false">👀 看讲解</button>
            </div>
            <div class="levels" id="levels" role="group" aria-label="难度"></div>
            <p class="level-info"><span id="levelDesc"></span><span id="stars" class="stars"></span></p>
        </section>

        <section class="board" id="board" aria-live="polite"></section>

        <section class="actions" id="actions"></section>
    </main>

    <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
